[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/library"
  to = "/.netlify/functions/public-library"
  status = 200

[[redirects]]
  from = "/api/admin/documents"
  to = "/.netlify/functions/admin-documents"
  status = 200

[[redirects]]
  from = "/api/admin/document"
  to = "/.netlify/functions/admin-document"
  status = 200

[[redirects]]
  from = "/api/admin/document/replace"
  to = "/.netlify/functions/admin-document-replace"
  status = 200

[[redirects]]
  from = "/api/admin/categories"
  to = "/.netlify/functions/admin-categories"
  status = 200

[[redirects]]
  from = "/api/admin/category"
  to = "/.netlify/functions/admin-category"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
